<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Work | Alina Xie</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Figtree:ital,wght@0,300..900;1,300..900&family=Oranienbaum&family=Young+Serif&display=swap" rel="stylesheet">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="index.html" class="nav-logo">
      <img src="images/logo.png" alt="Alina Xie Logo" />
    </a>
    <ul class="nav-links" id="navLinks">
      <li class="dropdown">
        <a href="#" class="dropdown-toggle">Graphic Design <span class="arrow">▾</span></a>
        <ul class="dropdown-menu">
          <li><a href="branding.html">Branding</a></li>
          <li><a href="personal-work.html">Personal Work</a></li>
        </ul>
      </li>
      <li><a href="digital-media.html">Digital Media</a></li>
      <li><a href="fine-art.html">Fine Art</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- PAGE HERO -->
  <section class="page-hero">
    <div class="page-hero-bg">
      <img src="images/heroBackground.jpg"/>
      <div class="hero-overlay"></div>
    </div>
    <div class="page-hero-text">
      <h1>Personal Work</h1>
      <p>Adobe Illustrator, Photoshop</p>
    </div>
  </section>

  <!-- GALLERY -->
  <main class="pw-main section-personal">
    <div class="pw-grid">

      <!-- Row 1: three portrait images -->
      <div class="pw-row">
        <div class="pw-item" data-index="0">
            <img src="images/graphicDesign/graphicDesign1.jpg">
        </div>
        <div class="pw-item" data-index="1">
            <img src="images/graphicDesign/graphicDesign2.jpg">
        </div>
        <div class="pw-item" data-index="2">
            <img src="images/graphicDesign/graphicDesign3.jpg">
        </div>
      </div>

      <!-- Row 2: wide + two narrow -->
      <div class="pw-row">
        <div class="pw-item pw-flex-3" data-index="3">
            <img src="images/graphicDesign/graphicDesign4.png">
        </div>
        <div class="pw-item pw-flex-1" data-index="4">
            <img src="images/graphicDesign/graphicDesign6.png">
        </div>
        <div class="pw-item pw-flex-1" data-index="5">
            <img src="images/graphicDesign/graphicDesign7.png">
        </div>
      </div>

      <!-- Row 3: two landscape images -->
      <div class="pw-row">
        <div class="pw-item" data-index="6">
            <img src="images/graphicDesign/graphicDesign5.jpg">
        </div>
        <div class="pw-item" data-index="7">
            <img src="images/graphicDesign/graphicDesign8.jpg">
        </div>
      </div>

    </div>
  </main>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" aria-modal="true" role="dialog">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">&#10005;</button>
    <button class="lightbox-arrow lightbox-prev" id="lightboxPrev" aria-label="Previous">&#8592;</button>
    <div class="lightbox-img-wrap">
      <img src="" alt="" id="lightboxImg" />
    </div>
    <button class="lightbox-arrow lightbox-next" id="lightboxNext" aria-label="Next">&#8594;</button>
  </div>
  <div class="lightbox-backdrop" id="lightboxBackdrop"></div>

  <div class="page-links">
    <a href="#top" class="top-link">TOP ↑</a>
    <a href="branding.html">← Back to Branding</a>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <a href="index.html">ALINA XIE</a>
    <a href="index.html" class="footer-logo">
        <img src="images/logo.png"> 
    </a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
