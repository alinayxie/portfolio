<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fine Art | Alina Xie</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Figtree:ital,wght@0,300..900;1,300..900&family=Oranienbaum&family=Young+Serif&display=swap" rel="stylesheet">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="index.html" class="nav-logo">
      <img src="images/logo.png" alt="Alina Xie Logo" />
    </a>
    <ul class="nav-links" id="navLinks">
      <li class="dropdown">
        <a href="#" class="dropdown-toggle">Graphic Design <span class="arrow">▾</span></a>
        <ul class="dropdown-menu">
          <li><a href="branding.html">Branding</a></li>
          <li><a href="personal-work.html">Personal Work</a></li>
        </ul>
      </li>
      <li><a href="digital-media.html">Digital Media</a></li>
      <li><a href="fine-art.html">Fine Art</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- PAGE HERO -->
  <section class="page-hero">
    <div class="page-hero-bg">
      <img src="images/heroBackground.jpg"/>
      <div class="hero-overlay"></div>
    </div>
    <div class="page-hero-text">
      <h1>Fine Art</h1>
      <p>Graphite, Charcoal, Colored Pencil, Watercolor, Oil and Acrylic Paint</p>
    </div>
  </section>

  <!-- GALLERY -->
  <main class="pw-main section-personal">
    <div class="fine-art-grid">

      <div class="fine-art-col">
        <div id="fa-item-1" class="pw-item" data-index="0">
          <img id="fa-img-1" src="images/fineArt/fineArt1.png">
        </div>
        <div id="fa-item-2" class="pw-item" data-index="1">
          <img id="fa-img-2" src="images/fineArt/fineArt2.png">
        </div>
        <div id="fa-item-3" class="pw-item" data-index="2">
          <img id="fa-img-3" src="images/fineArt/fineArt3.png">
        </div>
      </div>

      <div class="fine-art-col">
        <div id="fa-item-4" class="pw-item" data-index="3">
          <img id="fa-img-4" src="images/fineArt/fineArt4.png">
        </div>
        <div id="fa-item-5" class="pw-item" data-index="4">
          <img id="fa-img-5" src="images/fineArt/fineArt5.png">
        </div>
        <div id="fa-item-6" class="pw-item" data-index="5">
          <img id="fa-img-6" src="images/fineArt/fineArt6.png">
        </div>
        <div id="fa-item-7" class="pw-item" data-index="6">
          <img id="fa-img-7" src="images/fineArt/fineArt7.png">
        </div>
      </div>

      <div class="fine-art-col">
        <div id="fa-item-8" class="pw-item" data-index="7">
          <img id="fa-img-8" src="images/fineArt/fineArt8.png">
        </div>
        <div id="fa-item-9" class="pw-item" data-index="8">
          <img id="fa-img-9" src="images/fineArt/fineArt9.png">
        </div>
        <div id="fa-item-10" class="pw-item" data-index="9">
          <img id="fa-img-10" src="images/fineArt/fineArt10.png">
        </div>
        <div id="fa-item-11" class="pw-item" data-index="10">
          <img id="fa-img-11" src="images/fineArt/fineArt11.png">
        </div>
      </div>

    </div>
  </main>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" aria-modal="true" role="dialog">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">&#10005;</button>
    <button class="lightbox-arrow lightbox-prev" id="lightboxPrev" aria-label="Previous">&#8592;</button>
    <div class="lightbox-img-wrap">
      <img src="" alt="" id="lightboxImg" />
    </div>
    <button class="lightbox-arrow lightbox-next" id="lightboxNext" aria-label="Next">&#8594;</button>
  </div>
  <div class="lightbox-backdrop" id="lightboxBackdrop"></div>

  <div class="page-links">
    <a href="#top" class="top-link">TOP ↑</a>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <a href="index.html">ALINA XIE</a>
    <a href="index.html" class="footer-logo">
        <img src="images/logo.png">
    </a>
  </footer>

  <script src="script.js"></script>

</html>
